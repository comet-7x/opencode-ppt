[project]
name = "opencode-ppt"
version = "0.1.0"
description = "A opencode server to generate PowerPoint files"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "comet-7x" }]
dependencies = [
    "opencode-ai>=0.1.0a36",
    # "openai>=2.36.0",
    # "pymilvus>=3.0.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.138.2",
    "httpx[socks]>=0.28.1",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.51.0",
    "camel-ai>=0.2.90",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort(导入排序)
    "N",    # pep8-naming
    "UP",   # pyupgrade(自动用新语法)
    "B",    # flake8-bugbear(常见 bug 模式)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async(异步陷阱,你用得上)
    "S",    # flake8-bandit(安全检查,替代单独的 bandit)
    "RUF",  # Ruff 专有规则
]
ignore = [
    "E501",  # 行长交给 formatter 管
    "B008",  # FastAPI 的 Depends() 默认参数是惯例,放行
    "RUF001",  # 中文全角标点(注释/文档串)非歧义,放行
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 测试里允许 assert
# 底层 opencode 客户端属阶段二（渲染）迁移代码，lint 收敛推迟到阶段二重写时统一做
"app/components/opencode/**" = ["ASYNC109", "N802", "RUF006", "S101", "S110", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"          # async def test_* 自动识别,无需逐个标记
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=95",   # 覆盖率下限,防回退(当前 99%)
]
